# GeoDuello dietro Nginx. Il pezzo che NON puo' mancare e' l'aggiornamento a
# WebSocket: senza, la pagina si apre ma la partita non parte mai, perche' il
# gioco vive tutto sul canale in tempo reale.
#
# Copiare in /etc/nginx/sites-available/geoduello e collegare in sites-enabled.

server {
    listen 80;
    server_name geoduello.tuodominio.it;
    # il certificato lo gestisce certbot: certbot --nginx -d geoduello.tuodominio.it
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name geoduello.tuodominio.it;

    ssl_certificate     /etc/letsencrypt/live/geoduello.tuodominio.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geoduello.tuodominio.it/privkey.pem;

    # IP del container LXC in cui gira il gioco
    set $geoduello 192.168.1.50:3000;

    location / {
        proxy_pass http://$geoduello;
        proxy_http_version 1.1;

        # --- WebSocket: le due righe decisive ---
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La partita puo' restare ferma qualche minuto fra un round e l'altro:
        # con il timeout di default (60s) il canale cadrebbe di continuo.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # niente bufferizzazione: gli aggiornamenti devono arrivare subito
        proxy_buffering off;
    }
}
